<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Il Mio Account — M&M Energy Club</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/assets/css/loyalty.css">
  <link rel="stylesheet" href="/assets/css/loyalty-customer.css">
</head>

<body>
  <div class="lc-shell">

    <!-- ── Topbar ─────────────────────────────────────────── -->
    <header class="lc-topbar" role="banner">
      <div class="lc-topbar-left">
        <img
          src="/assets/images/logo-light.png"
          alt="M&M Consulting"
          class="lc-topbar-logo"
        >
        <span class="lc-topbar-brand">Energy Club</span>
      </div>

      <span class="lc-topbar-greeting" id="topbarGreeting" aria-live="polite"></span>

      <button
        class="lc-topbar-logout"
        id="logoutBtn"
        type="button"
        aria-label="Disconnettiti dal tuo account"
      >
        <i class="fa fa-right-from-bracket" aria-hidden="true"></i>
        Esci
      </button>
    </header>

    <!-- ── Main content ───────────────────────────────────── -->
    <main class="lc-content" id="mainContent">

      <!-- ══ QR SECTION ══════════════════════════════════════ -->
      <section aria-labelledby="qrSectionTitle">
        <h2 class="sr-only" id="qrSectionTitle">Il tuo QR code personale</h2>

        <div class="lc-qr-card lc-fade-in" id="qrCard">

          <span class="lc-qr-eyebrow">M&amp;M Energy Club</span>

          <p class="lc-qr-name" id="qrCustomerName">&nbsp;</p>

          <!-- QR image frame — skeleton shown while loading -->
          <div class="lc-qr-frame" id="qrFrame" role="img" aria-label="QR code personale">
            <div class="lc-qr-skeleton" id="qrSkeleton" aria-hidden="true"></div>
            <img
              id="qrImage"
              src=""
              alt="QR code personale M&M Energy Club"
              style="display:none;"
            >
          </div>

          <!-- TTL countdown -->
          <div class="lc-qr-ttl" aria-live="polite" aria-atomic="true">
            <span class="lc-qr-ttl-dot" id="qrStatusDot" aria-hidden="true"></span>
            <span>QR valido per&nbsp;</span>
            <span class="lc-qr-countdown" id="qrCountdown">—</span>
          </div>

          <!-- Manual refresh -->
          <button
            class="lc-qr-refresh-btn"
            id="qrRefreshBtn"
            type="button"
            aria-label="Aggiorna il QR code"
          >
            <i class="fa fa-rotate-right" aria-hidden="true"></i>
            Aggiorna QR
          </button>

        </div>
      </section>


      <!-- ══ OFFERS SECTION ══════════════════════════════════ -->
      <section aria-labelledby="offersSectionTitle">

        <div class="lc-section-header">
          <h2 class="lc-section-title" id="offersSectionTitle">
            Convenzioni disponibili
          </h2>
          <span class="lc-section-count" id="offersCount" aria-live="polite"></span>
        </div>

        <div class="lc-offers-list" id="offersList" aria-label="Lista convenzioni">
          <!-- Populated by dashboard.js -->
          <div class="lc-empty">
            <span class="lc-empty-icon" aria-hidden="true">🎁</span>
            <p class="lc-empty-text">Caricamento convenzioni…</p>
          </div>
        </div>

      </section>


      <!-- ══ HISTORY SECTION ═════════════════════════════════ -->
      <section aria-labelledby="historySectionTitle">

        <div class="lc-section-header">
          <h2 class="lc-section-title" id="historySectionTitle">
            Storico utilizzi
          </h2>
          <span class="lc-section-count" id="historyCount" aria-live="polite"></span>
        </div>

        <div class="lc-history-list" id="historyList" aria-label="Storico utilizzi convenzioni">
          <!-- Populated by dashboard.js -->
          <div class="lc-empty">
            <span class="lc-empty-icon" aria-hidden="true">📋</span>
            <p class="lc-empty-text">Caricamento storico…</p>
          </div>
        </div>

      </section>

    </main>
  </div>

  <script type="module" src="/js/features/loyalty/customer/dashboard.js"></script>
</body>

</html>

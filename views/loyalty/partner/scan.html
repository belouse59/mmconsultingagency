<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Scansiona QR — Partner M&M Consulting</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/loyalty.css">
</head>
<body>

<div class="loyalty-shell">

  <header class="loyalty-topbar" role="banner">
    <a href="/" class="loyalty-topbar-logo" aria-label="Torna alla homepage M&M Consulting">
      <img src="/assets/images/logo.png" alt="M&M Consulting" width="100" height="32">
      <span class="loyalty-topbar-brand">Partner</span>
    </a>
    <div class="loyalty-topbar-actions">
      <span class="loyalty-topbar-user" id="topbarPartnerName" aria-live="polite"></span>
      <button class="loyalty-topbar-logout" id="logoutBtn" aria-label="Esci dall'account partner">Esci</button>
    </div>
  </header>

  <!-- Offline banner -->
  <div class="loyalty-offline-banner" id="offlineBanner" role="alert" aria-live="assertive" style="display:none;">
    <span aria-hidden="true">📡</span>
    Connessione assente — le scansioni non possono essere validate offline.
  </div>

  <main class="loyalty-main" id="main-content">

    <!-- ══ PHASE 1: SCANNER ══ -->
    <div class="loyalty-card loyalty-card--wide loyalty-fade-in" id="scanPhase">

      <p class="loyalty-section-title">Scansiona il QR del cliente</p>

      <!-- Camera selector — shown if multiple cameras detected -->
      <div id="cameraSelectorWrap" style="display:none;margin-bottom:12px;">
        <div class="loyalty-field" style="margin-bottom:0;">
          <label for="cameraSelect">Fotocamera</label>
          <select class="loyalty-offer-select" id="cameraSelect" aria-label="Seleziona fotocamera"></select>
        </div>
      </div>

      <!-- Scanner viewport -->
      <div class="loyalty-scan-area">
        <div id="loyalty-qr-reader" role="region" aria-label="Lettore QR code via fotocamera"></div>
      </div>

      <!-- Manual token fallback -->
      <div class="loyalty-manual-input-wrap" style="margin-top:16px;">
        <button
          class="loyalty-manual-toggle"
          id="manualToggle"
          type="button"
          aria-expanded="false"
          aria-controls="manualInputArea">
          📋 Inserisci token manualmente
        </button>
        <div id="manualInputArea" style="display:none;margin-top:12px;">
          <div class="loyalty-field">
            <label for="manualToken">Token QR</label>
            <input
              type="text"
              id="manualToken"
              name="manualToken"
              placeholder="Incolla qui il token QR del cliente"
              autocomplete="off"
              spellcheck="false"
              aria-label="Token QR manuale">
          </div>
          <button type="button" class="loyalty-btn-submit" id="manualSubmitBtn" style="margin-top:8px;">
            <span class="btn-label">Valida token</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <p style="text-align:center;font-size:0.78rem;color:var(--text-secondary,#6B7A8D);margin-top:16px;line-height:1.5;">
        📱 Chiedi al cliente di aprire il suo QR dall'app Convenzioni.
      </p>

    </div>

    <!-- ══ PHASE 2: CONFIRM REDEMPTION ══ -->
    <div class="loyalty-card loyalty-card--wide" id="confirmPhase" style="display:none;" aria-live="polite">

      <!-- Customer verification result -->
      <div class="loyalty-scan-result" id="scanResult">

        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <span class="loyalty-scan-result-badge" id="resultBadge">Verifica...</span>
          <!-- QR expiry countdown shown during confirm phase -->
          <span class="loyalty-qr-expiry" id="qrExpiry" aria-live="polite" style="display:none;">
            ⏱ QR valido per <strong id="qrExpiryText">--:--</strong>
          </span>
        </div>

        <p class="loyalty-scan-customer-name" id="customerName"></p>
        <p class="loyalty-scan-result-message" id="resultMessage"></p>

      </div>

      <!-- Offer selection — only ineligible offers shown as disabled -->
      <div class="loyalty-field" style="margin-top:16px;" id="offerSelectWrap">
        <label for="offerSelect">Seleziona l'offerta da applicare</label>
        <select class="loyalty-offer-select" id="offerSelect" required aria-required="true">
          <option value="" disabled selected>— Scegli un'offerta —</option>
        </select>
        <!-- Offer description shown below select when one is chosen -->
        <p class="loyalty-offer-hint" id="offerHint" style="margin-top:6px;font-size:0.78rem;color:var(--text-secondary,#6B7A8D);display:none;"></p>
      </div>

      <!-- Error -->
      <div class="loyalty-error" id="redeemError" role="alert" aria-live="polite">
        <span class="loyalty-error-icon" aria-hidden="true">⚠</span>
        <span id="redeemErrorText"></span>
      </div>

      <!-- Success — shows receipt -->
      <div class="loyalty-success" id="redeemSuccess" role="status" aria-live="polite" style="display:none;">
        <div style="width:100%;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span aria-hidden="true" style="font-size:1.2rem;">✓</span>
            <strong id="redeemSuccessText"></strong>
          </div>
          <!-- Redemption receipt -->
          <div class="loyalty-receipt" id="redemptionReceipt" style="display:none;">
            <div class="loyalty-receipt-row">
              <span>Cliente</span>
              <strong id="receiptCustomer"></strong>
            </div>
            <div class="loyalty-receipt-row">
              <span>Offerta</span>
              <strong id="receiptOffer"></strong>
            </div>
            <div class="loyalty-receipt-row">
              <span>Orario</span>
              <strong id="receiptTime"></strong>
            </div>
            <div class="loyalty-receipt-row">
              <span>ID transazione</span>
              <strong id="receiptId" style="font-size:0.72rem;"></strong>
            </div>
          </div>
        </div>
      </div>

      <!-- Action buttons -->
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
        <button type="button" class="loyalty-btn-redeem" id="confirmRedeemBtn" disabled aria-disabled="true">
          <span class="btn-label">✓ Applica sconto</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
        <button type="button" class="loyalty-btn-scan-again" id="scanAgainBtn">
          ↩ Scansiona un altro QR
        </button>
      </div>

    </div>

  </main>

</div>

<!-- Html5Qrcode from CDN — no build step required -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module" src="/js/features/loyalty/partner/partnerScan.js"></script>
</body>
</html>

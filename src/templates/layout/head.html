<!-- ===== BASE SEO HEAD TEMPLATE ===== -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Theme / Geo -->
<meta name="theme-color" content="#F7F6F4">
<meta name="geo.region" content="IT-ME">
<meta name="geo.placename" content="Messina">
<meta name="geo.position" content="38.1938;15.5540">
<meta name="ICBM" content="38.1938,15.5540">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon.png">
<link rel="apple-touch-icon" href="/assets/images/favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous" referrerpolicy="no-referrer">

<!-- Default CSS -->
<link rel="stylesheet" href="/assets/css/styles.css">

<!-- ===== SEO VARIABLES (PER PAGE) ===== -->
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="{{ROBOTS}}">
<meta name="author" content="M&M Consulting Messina">

<link rel="canonical" href="{{CANONICAL_URL}}">

<!-- Open Graph -->
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:locale" content="it_IT">
<meta property="og:site_name" content="M&M Consulting">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<!-- Optional Page-Specific CSS -->
{{EXTRA_CSS}}

<!-- Optional Structured Data -->
{{STRUCTURED_DATA}}

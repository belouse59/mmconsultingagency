<header class="site-header" role="banner">
  <nav class="nav" aria-label="Navigazione principale">

    <!-- LOGO -->
    <div class="nav-logo">
      <a href="/" aria-label="{{LOGO_ARIA}}">
        <img src="{{LOGO_SRC}}" alt="{{LOGO_ALT}}" width="140" height="40">
      </a>
    </div>

    <!-- DESKTOP NAV -->
    <ul class="nav-links" role="list">
      {{NAV_ITEMS}}
    </ul>

    <!-- CTA -->
    <div class="nav-cta">
      <a id="navCtaBtn" href="{{CTA_LINK}}" class="btn btn-gold nav-cta-btn">
        <i class="fa fa-phone" aria-hidden="true"></i>
        <span class="nav-cta-text">{{CTA_TEXT}}</span>
      </a>
    </div>

    <!-- MOBILE BUTTON -->
    <button class="nav-burger" id="navBurger" aria-label="Apri menu"
      aria-expanded="false" aria-controls="mobileMenu">
      <span></span><span></span><span></span>
    </button>

  </nav>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true">

    <ul role="list">
      {{MOBILE_NAV_ITEMS}}

      <li>
        <a href="{{CTA_LINK}}" class="mobile-link mobile-link--cta">
          {{CTA_TEXT}}
        </a>
      </li>
    </ul>

  </div>
</header>

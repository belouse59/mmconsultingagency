<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Loyalty Admin</title>
  <link rel="stylesheet" href="../../assets/css/loyalty-brand.css" />
</head>

<body class="loyalty-admin-page">

  <main class="loyalty-admin-layout">

    <!-- SIDEBAR -->
    <aside class="loyalty-admin-sidebar">
      <div class="loyalty-admin-brand">
        Loyalty Admin
      </div>

      <nav class="loyalty-admin-nav">
        <button class="admin-nav-btn active">
          Dashboard
        </button>
      </nav>

      <button
        id="adminLogoutBtn"
        class="loyalty-btn loyalty-btn-secondary"
      >
        Logout
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <section class="loyalty-admin-content">

      <header class="loyalty-admin-header">
        <h1>Operations Dashboard</h1>
        <p>
          Manage customers, offers and redemption activity
        </p>
      </header>

      <!-- KPI -->
      <section class="loyalty-admin-stats">

        <div class="admin-stat-card">
          <span>Customers</span>
          <strong id="totalCustomers">--</strong>
        </div>

        <div class="admin-stat-card">
          <span>Redemptions</span>
          <strong id="totalRedemptions">--</strong>
        </div>

      </section>

      <!-- CREATE OFFER -->
      <section class="admin-table-card">
        <h2>Create Offer</h2>

        <form id="offerForm" class="loyalty-form">

          <div class="loyalty-field">
            <label for="offerTitle">Offer Title</label>
            <input
              id="offerTitle"
              type="text"
              placeholder="Ex: 10% Partner Discount"
              required
            />
          </div>

          <div class="loyalty-field">
            <label for="offerPartner">Partner</label>
            <input
              id="offerPartner"
              type="text"
              placeholder="Partner identifier"
              required
            />
          </div>

          <button
            type="submit"
            class="loyalty-btn loyalty-btn-primary"
          >
            Create Offer
          </button>
        </form>

        <div id="offerMessage" class="loyalty-feedback"></div>
      </section>

      <!-- CUSTOMERS -->
      <section class="admin-table-card">
        <h2>Customers</h2>

        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Identifier</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="customersTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- REDEMPTIONS -->
      <section class="admin-table-card">
        <h2>Recent Redemptions</h2>

        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Partner</th>
                <th>Date</th>
              </tr>
            </thead>

            <tbody id="redemptionsTableBody"></tbody>
          </table>
        </div>
      </section>

    </section>
  </main>

  <script src="../../js/features/loyalty/admin/admin.js"></script>
</body>
</html>

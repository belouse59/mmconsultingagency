<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reimposta password — Convenzioni M&M Consulting</title>

  <link rel="icon" type="image/png" href="/assets/images/favicon-32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/loyalty.css">
</head>

<body>

<div class="loyalty-shell">

  <header class="loyalty-topbar" role="banner">
    <a href="/" class="loyalty-topbar-logo">
      <img src="/assets/images/logo.png" alt="M&M Consulting" width="100" height="32">
      <span class="loyalty-topbar-brand">Convenzioni</span>
    </a>
  </header>

  <main class="loyalty-main">


<div class="loyalty-card loyalty-fade-in">

  <!-- HEADER -->
  <div class="loyalty-auth-header">
    <div class="loyalty-auth-icon" aria-hidden="true">🔑</div>

    <h1 class="loyalty-auth-title">Reimposta la password</h1>

    <p class="loyalty-auth-sub">
      Scegli una nuova password sicura per il tuo account.
    </p>
  </div>

  <!-- SUCCESS -->
  <div class="loyalty-success" id="resetSuccess" role="status" aria-live="polite">
    <span class="loyalty-success-icon" aria-hidden="true">✓</span>
    <span>Password aggiornata con successo. Reindirizzamento in corso…</span>
  </div>

  <!-- ERROR -->
  <div class="loyalty-error" id="resetError" role="alert" aria-live="polite">
    <span class="loyalty-error-icon" aria-hidden="true">⚠</span>
    <span id="resetErrorText"></span>
  </div>

  <!-- FORM -->
  <form id="resetPasswordForm" novalidate>

    <div class="loyalty-field">
      <label for="password">Nuova password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="new-password"
        required
        aria-required="true">
      
      <!-- password strength (your existing system) -->
      <div id="passwordStrength" class="password-strength"></div>
    </div>

    <div class="loyalty-field">
      <label for="confirmPassword">Conferma password</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        autocomplete="new-password"
        required
        aria-required="true">
    </div>
        <div class="loyalty-password-strength" id="passwordStrength" aria-live="polite">
          <div class="loyalty-strength-bar">
            <div class="loyalty-strength-fill" id="strengthFill"></div>
          </div>
          <span class="loyalty-strength-label" id="strengthLabel"></span>
        </div>

    <button type="submit" class="loyalty-btn-submit" id="submitBtn">
      <span class="btn-label">Aggiorna password</span>
      <span class="btn-spinner" aria-hidden="true"></span>
    </button>

  </form>

  <!-- FOOTER -->
  <p class="loyalty-auth-footer">
    <a href="/loyalty/partner/login.html">Torna al login</a>
  </p>

</div>


  </main>

</div>

<script type="module" src="/js/features/loyalty/partner/reset-password.js"></script>

</body>
</html>

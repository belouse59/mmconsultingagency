<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Partner Access</title>

  <link rel="stylesheet" href="../../assets/css/loyalty-brand.css" />
</head>

<body class="loyalty-page">

  <main class="loyalty-card loyalty-auth-card">

    <div class="loyalty-auth-header">
      <h1 class="loyalty-title">Partner Portal</h1>
      <p class="loyalty-subtitle">
        Access the validation area to scan and verify member benefits
      </p>
    </div>

    <form id="partnerLoginForm" class="loyalty-form">

      <div class="loyalty-field">
        <label for="partnerId">Partner ID</label>
        <input
          id="partnerId"
          type="text"
          placeholder="Enter your partner ID"
          required
        />
      </div>

      <div class="loyalty-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button
        type="submit"
        class="loyalty-btn loyalty-btn-primary"
      >
        Access Scanner
      </button>

    </form>

    <div id="partnerLoginMessage" class="loyalty-feedback"></div>

  </main>

  <script src="../../js/features/loyalty/partner/login.js"></script>
</body>
</html>

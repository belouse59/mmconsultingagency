<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Create Membership</title>
  <link rel="stylesheet" href="../../assets/css/loyalty-brand.css" />
</head>

<body class="loyalty-page">

  <main class="loyalty-card loyalty-auth-card">

    <div class="loyalty-auth-header">
      <h1 class="loyalty-title">Join the Program</h1>
      <p class="loyalty-subtitle">
        Create your member account and unlock exclusive partner benefits
      </p>
    </div>

    <form id="registerForm" class="loyalty-form">

      <div class="loyalty-field">
        <label for="name">Full Name</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="loyalty-field">
        <label for="identifier">Identifier</label>
        <input
          id="identifier"
          name="identifier"
          type="text"
          placeholder="Enter your identifier"
          required
        />
      </div>

      <div class="loyalty-field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Create a password"
          required
        />
      </div>

      <button
        type="submit"
        class="loyalty-btn loyalty-btn-primary"
      >
        Create Membership
      </button>

    </form>

    <div id="registerMessage" class="loyalty-feedback"></div>

    <div class="loyalty-auth-footer">
      Already a member?
      <a href="/loyalty/customer/login.html">Access your account</a>
    </div>

  </main>

  <script src="../../js/features/loyalty/customer/register.js"></script>
</body>
</html>

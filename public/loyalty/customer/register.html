<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Registrazione — Convenzioni M&M Consulting</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/loyalty.css">
</head>
<body>

<div class="loyalty-shell">

  <header class="loyalty-topbar" role="banner">
    <a href="/" class="loyalty-topbar-logo" aria-label="Torna alla homepage M&M Consulting">
      <img src="/assets/images/logo.png" alt="M&M Consulting" width="100" height="32">
      <span class="loyalty-topbar-brand">Convenzioni</span>
    </a>
    <div class="loyalty-topbar-actions">
      <span class="loyalty-topbar-user" id="topbarUserName" aria-live="polite"></span>
      <button class="loyalty-topbar-logout" id="logoutBtn" aria-label="Esci dall'account">
        Esci
      </button>
    </div>
  </header>

  <main class="loyalty-main" id="main-content">
    <div class="loyalty-card loyalty-fade-in">

      <div class="loyalty-auth-header">
        <div class="loyalty-auth-icon" aria-hidden="true">✨</div>
        <h1 class="loyalty-auth-title">Crea il tuo account</h1>
        <p class="loyalty-auth-sub">
          Registrati per ricevere il tuo QR code personale e accedere agli sconti esclusivi dei partner convenzionati.
        </p>
      </div>

      <div class="loyalty-error" id="registerError" role="alert" aria-live="polite">
        <span class="loyalty-error-icon" aria-hidden="true">⚠</span>
        <span id="registerErrorText"></span>
      </div>

      <div class="loyalty-success" id="registerSuccess" role="status" aria-live="polite">
        <span aria-hidden="true">✓</span>
        <span>Registrazione completata! Verrai reindirizzato...</span>
      </div>

      <form id="registerForm" novalidate>

        <div class="loyalty-field">
          <label for="full_name">Nome completo</label>
          <input
            type="text"
            id="full_name"
            name="full_name"
            placeholder="Mario Rossi"
            autocomplete="name"
            required
            aria-required="true"
            minlength="2">
        </div>

        <div class="loyalty-field">
          <label for="identifier">Email o numero di telefono</label>
          <input
            type="text"
            id="identifier"
            name="identifier"
            placeholder="mario@email.com oppure +39 333 000 0000"
            autocomplete="username"
            inputmode="email"
            required
            aria-required="true">
        </div>

        <div class="loyalty-field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimo 8 caratteri"
            autocomplete="new-password"
            minlength="8"
            required
            aria-required="true">
        </div>

        <div class="loyalty-field">
          <label for="confirmPassword">Conferma password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Ripeti la password"
            autocomplete="new-password"
            minlength="8"
            required
            aria-required="true">
        </div>
        <div class="loyalty-password-strength" id="passwordStrength" aria-live="polite">
          <div class="loyalty-strength-bar">
            <div class="loyalty-strength-fill" id="strengthFill"></div>
          </div>
          <span class="loyalty-strength-label" id="strengthLabel"></span>
        </div>

        <button type="submit" class="loyalty-btn-submit" id="submitBtn">
          <span class="btn-label">Crea account</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

      </form>

      <p class="loyalty-auth-footer">
        Hai già un account?
        <a href="/loyalty/customer/login.html">Accedi</a>
      </p>

    </div>
  </main>

</div>

<script type="module" src="/js/features/loyalty/customer/register.js"></script>
</body>
</html>

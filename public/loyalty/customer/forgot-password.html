<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Password dimenticata — Convenzioni M&M Consulting</title>

  <link rel="icon" type="image/png" href="/assets/images/favicon-32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/loyalty.css">
</head>

<body>

<div class="loyalty-shell">

  <header class="loyalty-topbar" role="banner">
    <a href="/" class="loyalty-topbar-logo" aria-label="Torna alla homepage M&M Consulting">
      <img src="/assets/images/logo.png" alt="M&M Consulting" width="100" height="32">
      <span class="loyalty-topbar-brand">Convenzioni</span>
    </a>
  </header>

  <main class="loyalty-main" id="main-content">

<div class="loyalty-card loyalty-fade-in">

  <div class="loyalty-auth-header">
    <div class="loyalty-auth-icon" aria-hidden="true">🔐</div>

    <h1 class="loyalty-auth-title">Password dimenticata</h1>

    <p class="loyalty-auth-sub">
      Inserisci il tuo indirizzo email o numero di telefono.
      Ti invieremo un link per reimpostare la password.
    </p>
  </div>

  <div class="loyalty-success" id="resetSuccess" role="status" aria-live="polite" style="display:none;">
    <span class="loyalty-success-icon" aria-hidden="true">✓</span>
    <span>
      Se l’account esiste, riceverai a breve un’email con le istruzioni.
    </span>
  </div>

  <div class="loyalty-error" id="resetError" role="alert" aria-live="polite" style="display:none;">
    <span class="loyalty-error-icon" aria-hidden="true">⚠</span>
    <span id="resetErrorText"></span>
  </div>

  <form id="forgotPasswordForm" novalidate>

    <div class="loyalty-field">
      <label for="identifier">Email o numero di telefono</label>
      <input
        type="text"
        id="identifier"
        name="identifier"
        placeholder="mario@email.com oppure +39 333 000 0000"
        autocomplete="username"
        required
        aria-required="true">
    </div>

    <button type="submit" class="loyalty-btn-submit" id="resetBtn">
      <span class="btn-label">Invia link di reset</span>
      <span class="btn-spinner" aria-hidden="true"></span>
    </button>

  </form>

  <p class="loyalty-auth-footer">
    Ti sei ricordato la password?
    <a href="/loyalty/customer/login.html">Torna al login</a>
  </p>

</div>

  </main>

</div>

<script type="module" src="/js/features/loyalty/customer/forgot-password.js"></script>

</body>
</html>
